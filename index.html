    <meta charset="UTF-8" />

    <meta name="description" content="Plataforma dinâmica de estudo e consulta para Clínica Médica com busca inteligente, modo de teste ativo (ocultar células), anotações personalizadas e suporte a Markdown." />
    <meta property="og:title" content="Resumo Clínica Médica - Estudo Interativo" />
    <meta property="og:description" content="Plataforma dinâmica de estudo e consulta para Clínica Médica com busca inteligente, modo de teste ativo (ocultar células), anotações personalizadas e suporte a Markdown." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('clinica_theme_v1');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-zinc-200 dark:selection:bg-zinc-800 selection:text-black dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
